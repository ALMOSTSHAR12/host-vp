<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>VPS DARK - لوحة التحكم</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #0a0a2a 100%);
      color: #fff;
      min-height: 100vh;
    }
    
    /* خلفية متحركة */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    .particle {
      position: absolute;
      background: radial-gradient(circle, #00d4ff, transparent);
      border-radius: 50%;
      animation: float 20s infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-100px) rotate(180deg); opacity: 0.8; }
    }
    
    .topbar {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #00d4ff;
      position: relative;
      z-index: 10;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(90deg, #00d4ff, #0066ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .new-server-btn {
      background: linear-gradient(90deg, #00d4ff, #0066ff);
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s;
    }
    
    .new-server-btn:hover {
      transform: translateY(-2px);
    }
    
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }
    
    .servers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .server-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .server-card:hover {
      transform: translateY(-5px);
      border-color: #00d4ff;
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
    }
    
    .server-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #00d4ff;
    }
    
    .server-status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
    }
    
    .status-running {
      background: rgba(0, 255, 0, 0.2);
      color: #00ff00;
    }
    
    .status-stopped {
      background: rgba(255, 0, 0, 0.2);
      color: #ff5555;
    }
    
    /* صفحة السيرفر */
    .server-view {
      display: none;
    }
    
    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
    }
    
    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
    }
    
    .tab {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .tab.active {
      background: linear-gradient(90deg, #00d4ff, #0066ff);
    }
    
    .console {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      padding: 20px;
      height: 500px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    
    .control-panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 20px;
    }
    
    .control-btn {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .btn-start {
      background: linear-gradient(90deg, #00ff00, #00aa00);
      color: white;
    }
    
    .btn-stop {
      background: linear-gradient(90deg, #ff0000, #aa0000);
      color: white;
    }
    
    .btn-restart {
      background: linear-gradient(90deg, #ffa500, #ff6600);
      color: white;
    }
    
    .stats-card {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }
    
    .files-table {
      width: 100%;
      margin-top: 20px;
    }
    
    .files-table th, .files-table td {
      padding: 10px;
      text-align: right;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .file-btn {
      padding: 5px 10px;
      margin: 0 3px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .upload-area {
      border: 2px dashed #00d4ff;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }
    
    .upload-area:hover {
      background: rgba(0, 212, 255, 0.1);
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background: #1a1a2a;
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    textarea {
      width: 100%;
      height: 400px;
      background: #0a0a1a;
      border: 1px solid #00d4ff;
      color: white;
      padding: 10px;
      font-family: monospace;
      margin: 10px 0;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="topbar">
    <div class="logo">🚀 VPS DARK</div>
    <div>
      <span>مرحباً، <span id="username"></span></span>
      <button onclick="logout()" style="background: rgba(255,0,0,0.3); color: white; padding: 5px 15px; border: none; border-radius: 5px; margin-left: 10px; cursor: pointer;">🚪 خروج</button>
    </div>
  </div>
  
  <!-- الصفحة الرئيسية -->
  <div id="mainView" class="container">
    <button class="new-server-btn" onclick="showNewServerModal()">➕ سيرفر جديد</button>
    <div class="servers-grid" id="serversGrid"></div>
  </div>
  
  <!-- صفحة السيرفر -->
  <div id="serverView" class="container server-view">
    <button class="back-btn" onclick="backToMain()">← رجوع</button>
    <div class="server-header">
      <h1 id="serverTitle"></h1>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('console')">📋 Console</button>
        <button class="tab" onclick="switchTab('files')">📁 الملفات</button>
      </div>
    </div>
    
    <div id="consoleTab">
      <div style="display: grid; grid-template-columns: 1fr 300px; gap: 20px;">
        <div class="console" id="consoleLog">
          <div style="color: #888;">جاري تحميل السجلات...</div>
        </div>
        <div class="control-panel">
          <button class="control-btn btn-start" onclick="serverAction('start')">▶️ تشغيل</button>
          <button class="control-btn btn-restart" onclick="serverAction('restart')">🔄 إعادة تشغيل</button>
          <button class="control-btn btn-stop" onclick="serverAction('stop')">⏹️ إيقاف</button>
          
          <div class="stats-card">
            <div>📊 الحالة: <span id="status" style="color: #ff5555;">🔴 واقف</span></div>
            <div>💾 الذاكرة: <span id="memory">0 MB</span></div>
            <div>⚡ المعالج: <span id="cpu">0%</span></div>
            <div>🌐 IP: <span id="ip">127.0.0.1</span></div>
          </div>
          
          <div class="stats-card">
            <div>📄 ملف التشغيل: <span id="startupFile" style="color: #00d4ff; cursor: pointer;" onclick="changeStartup()">غير محدد</span></div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="filesTab" style="display: none;">
      <div class="upload-area" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
        📤 اسحب الملفات هنا أو اضغط للرفع
        <input type="file" id="fileInput" multiple style="display: none;" onchange="uploadFiles(this.files)">
      </div>
      
      <table class="files-table">
        <thead>
          <tr><th>الملف</th><th>الحجم</th><th>الإجراءات</th></tr>
        </thead>
        <tbody id="filesList"></tbody>
      </table>
    </div>
  </div>
  
  <!-- نافذة الإدخال -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <input type="text" id="modalInput" style="width: 100%; padding: 10px; margin: 10px 0; background: #0a0a1a; border: 1px solid #00d4ff; color: white;">
      <button onclick="modalConfirm()">تأكيد</button>
      <button onclick="closeModal()">إلغاء</button>
    </div>
  </div>
  
  <!-- محرر الملفات -->
  <div id="editorModal" class="modal">
    <div class="modal-content">
      <h3 id="editorTitle"></h3>
      <textarea id="editorContent"></textarea>
      <button onclick="saveFile()">💾 حفظ</button>
      <button onclick="closeEditor()">❌ إلغاء</button>
    </div>
  </div>
  
  <script>
    let currentServer = null;
    let currentFile = null;
    let pollingInterval = null;
    
    // إنشاء الجسيمات
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.width = Math.random() * 5 + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = 15 + Math.random() * 10 + 's';
        container.appendChild(particle);
      }
    }
    
    // التحقق من المستخدم
    async function checkAuth() {
      try {
        const res = await fetch('/api/current_user');
        const data = await res.json();
        
        if (!data.success) {
          window.location.href = '/login';
          return;
        }
        
        document.getElementById('username').textContent = data.username;
        createParticles();
        loadServers();
      } catch (error) {
        window.location.href = '/login';
      }
    }
    
    // تحميل السيرفرات
    async function loadServers() {
      try {
        const res = await fetch('/servers');
        const data = await res.json();
        
        const grid = document.getElementById('serversGrid');
        
        if (!data.servers || data.servers.length === 0) {
          grid.innerHTML = '<div style="text-align: center; padding: 50px;">📭 لا يوجد سيرفرات، اضف سيرفر جديد</div>';
          return;
        }
        
        grid.innerHTML = data.servers.map(s => `
          <div class="server-card" onclick="openServer('${s.folder}', '${s.title}')">
            <div class="server-title">${s.title}</div>
            <div>${s.subtitle}</div>
            <div class="server-status ${s.status === 'running' ? 'status-running' : 'status-stopped'}">
              ${s.status === 'running' ? '🟢 شغال' : '🔴 واقف'}
            </div>
            <div style="font-size: 12px; margin-top: 10px; color: #888;">
              ${s.startup_file ? '⚙️ ' + s.startup_file : '📁 لا يوجد ملف تشغيل'}
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading servers:', error);
      }
    }
    
    // فتح السيرفر
    function openServer(folder, title) {
      currentServer = folder;
      document.getElementById('mainView').style.display = 'none';
      document.getElementById('serverView').style.display = 'block';
      document.getElementById('serverTitle').textContent = title;
      
      // تحميل ملف التشغيل
      loadStartupFile();
      
      // بدء التحديث التلقائي
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(updateStats, 2000);
      updateStats();
    }
    
    // تحميل ملف التشغيل
    async function loadStartupFile() {
      try {
        const res = await fetch(`/server/stats/${currentServer}`);
        const data = await res.json();
        
        // استخراج ملف التشغيل من السجلات أو من meta.json
        const filesRes = await fetch(`/files/list/${currentServer}`);
        const files = await filesRes.json();
        
        // البحث عن meta.json
        const metaFile = files.find(f => f.name === 'meta.json');
        if (metaFile) {
          const metaRes = await fetch(`/files/content/${currentServer}/meta.json`);
          const meta = await metaRes.json();
          if (meta.content) {
            try {
              const metaData = JSON.parse(meta.content);
              if (metaData.startup_file) {
                document.getElementById('startupFile').textContent = metaData.startup_file;
              }
            } catch(e) {}
          }
        }
      } catch(e) {}
    }
    
    // تحديث الإحصائيات
    async function updateStats() {
      if (!currentServer) return;
      
      try {
        const res = await fetch(`/server/stats/${currentServer}`);
        const data = await res.json();
        
        document.getElementById('status').innerHTML = data.status === '🟢 شغال' ? '🟢 شغال' : '🔴 واقف';
        document.getElementById('status').style.color = data.status === '🟢 شغال' ? '#00ff00' : '#ff5555';
        document.getElementById('memory').textContent = data.mem;
        document.getElementById('cpu').textContent = data.cpu;
        document.getElementById('ip').textContent = data.ip;
        
        const consoleLog = document.getElementById('consoleLog');
        consoleLog.innerHTML = data.logs || '[لا توجد سجلات]';
        consoleLog.scrollTop = consoleLog.scrollHeight;
      } catch (error) {
        console.error('Error updating stats:', error);
      }
    }
    
    // التحكم بالسيرفر
    async function serverAction(action) {
      try {
        const res = await fetch(`/server/action/${currentServer}/${action}`, {
          method: 'POST'
        });
        const data = await res.json();
        
        if (data.success) {
          setTimeout(updateStats, 1000);
        } else {
          alert(data.message || 'حدث خطأ');
        }
      } catch (error) {
        alert('خطأ في الاتصال');
      }
    }
    
    // تغيير ملف التشغيل
    function changeStartup() {
      showModal('تعيين ملف التشغيل', 'أدخل اسم الملف (مثل: main.py)', async (value) => {
        if (!value) return;
        
        try {
          // حفظ في meta.json
          const filesRes = await fetch(`/files/list/${currentServer}`);
          const files = await filesRes.json();
          
          let metaContent = { startup_file: value };
          
          // التحقق من وجود meta.json
          const metaFile = files.find(f => f.name === 'meta.json');
          if (metaFile) {
            const metaRes = await fetch(`/files/content/${currentServer}/meta.json`);
            const meta = await metaRes.json();
            if (meta.content) {
              try {
                metaContent = { ...JSON.parse(meta.content), startup_file: value };
              } catch(e) {}
            }
          }
          
          // حفظ meta.json
          await fetch(`/files/save/${currentServer}/meta.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: JSON.stringify(metaContent, null, 2) })
          });
          
          // تحديث الواجهة
          await fetch(`/server/set-startup/${currentServer}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file: value })
          });
          
          document.getElementById('startupFile').textContent = value;
          alert('تم تعيين ملف التشغيل بنجاح');
        } catch (error) {
          alert('خطأ في حفظ الملف');
        }
      });
    }
    
    // تحميل الملفات
    async function loadFiles() {
      try {
        const res = await fetch(`/files/list/${currentServer}`);
        const files = await res.json();
        
        const tbody = document.getElementById('filesList');
        
        if (files.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">📂 لا يوجد ملفات</td></tr>';
          return;
        }
        
        tbody.innerHTML = files.map(f => `
          <tr>
            <td>${f.icon || '📄'} ${f.name}</td>
            <td>${f.size}</td>
            <td>
              <button class="file-btn" onclick="editFile('${f.name}')" style="background: #00d4ff;">✏️ تعديل</button>
              <button class="file-btn" onclick="deleteFile('${f.name}')" style="background: #ff5555;">🗑️ حذف</button>
              ${f.name === 'requirements.txt' ? '<button class="file-btn" onclick="installRequirements()" style="background: #ffa500;">📦 تثبيت</button>' : ''}
            </td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Error loading files:', error);
      }
    }
    
    // رفع الملفات
    async function uploadFiles(files) {
      const formData = new FormData();
      for (let file of files) {
        formData.append('files[]', file);
      }
      
      try {
        const res = await fetch(`/files/upload/${currentServer}`, {
          method: 'POST',
          body: formData
        });
        
        const data = await res.json();
        if (data.success) {
          alert(`✅ تم رفع ${data.uploaded_files.length} ملف`);
          loadFiles();
        } else {
          alert('❌ فشل الرفع');
        }
      } catch (error) {
        alert('خطأ في الرفع');
      }
    }
    
    // معالج السحب والإفلات
    function handleDrop(e) {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        uploadFiles(files);
      }
    }
    
    // تعديل ملف
    async function editFile(filename) {
      currentFile = filename;
      document.getElementById('editorTitle').textContent = `تعديل: ${filename}`;
      
      try {
        const res = await fetch(`/files/content/${currentServer}/${filename}`);
        const data = await res.json();
        document.getElementById('editorContent').value = data.content;
        document.getElementById('editorModal').style.display = 'flex';
      } catch (error) {
        alert('خطأ في قراءة الملف');
      }
    }
    
    // حفظ الملف
    async function saveFile() {
      const content = document.getElementById('editorContent').value;
      
      try {
        await fetch(`/files/save/${currentServer}/${currentFile}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        
        alert('✅ تم حفظ الملف');
        closeEditor();
      } catch (error) {
        alert('❌ فشل الحفظ');
      }
    }
    
    // حذف ملف
    async function deleteFile(filename) {
      if (!confirm(`⚠️ هل تريد حذف "${filename}"؟`)) return;
      
      try {
        await fetch(`/files/delete/${currentServer}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: filename })
        });
        
        alert('✅ تم الحذف');
        loadFiles();
      } catch (error) {
        alert('❌ فشل الحذف');
      }
    }
    
    // تثبيت المتطلبات
    async function installRequirements() {
      if (!confirm('📦 تثبيت المتطلبات من requirements.txt؟')) return;
      
      try {
        const res = await fetch(`/files/install/${currentServer}`, {
          method: 'POST'
        });
        const data = await res.json();
        
        if (data.success) {
          alert('✅ بدأ التثبيت، يمكنك متابعة السجلات في Console');
          switchTab('console');
        } else {
          alert('❌ ' + data.message);
        }
      } catch (error) {
        alert('خطأ في التثبيت');
      }
    }
    
    // تبديل التبويبات
    function switchTab(tab) {
      const consoleTab = document.getElementById('consoleTab');
      const filesTab = document.getElementById('filesTab');
      const tabs = document.querySelectorAll('.tab');
      
      tabs.forEach(t => t.classList.remove('active'));
      
      if (tab === 'console') {
        consoleTab.style.display = 'block';
        filesTab.style.display = 'none';
        tabs[0].classList.add('active');
      } else {
        consoleTab.style.display = 'none';
        filesTab.style.display = 'block';
        tabs[1].classList.add('active');
        loadFiles();
      }
    }
    
    // نافذة جديدة
    function showNewServerModal() {
      showModal('سيرفر جديد', 'أدخل اسم السيرفر', async (name) => {
        if (!name) return;
        
        try {
          const res = await fetch('/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          
          if (res.ok) {
            alert('✅ تم إنشاء السيرفر');
            loadServers();
          } else {
            alert('❌ فشل الإنشاء');
          }
        } catch (error) {
          alert('خطأ في الاتصال');
        }
      });
    }
    
    // نافذة الإدخال
    function showModal(title, placeholder, callback) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalInput').placeholder = placeholder;
      document.getElementById('modalInput').value = '';
      document.getElementById('modal').style.display = 'flex';
      
      window.modalCallback = callback;
    }
    
    function modalConfirm() {
      const value = document.getElementById('modalInput').value;
      if (window.modalCallback) {
        window.modalCallback(value);
      }
      closeModal();
    }
    
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
    
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    
    function backToMain() {
      if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
      }
      currentServer = null;
      document.getElementById('mainView').style.display = 'block';
      document.getElementById('serverView').style.display = 'none';
      loadServers();
    }
    
    function logout() {
      if (confirm('هل تريد تسجيل الخروج؟')) {
        fetch('/api/logout', { method: 'POST' }).then(() => {
          window.location.href = '/login';
        });
      }
    }
    
    // تشغيل
    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
